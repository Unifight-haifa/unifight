name = "unifight-panel"
main = "src/index.mjs"
compatibility_date = "2026-10-01"

# Secrets (SESSION_KEY, OWNER_EMAILS, TG_BOT_TOKEN, GITHUB_APP_KEY, ANTHROPIC_KEY) go via `wrangler secret put`, never here.
[vars]
ALLOWED_ORIGINS = "https://unifight-haifa.com,http://localhost:4321"
GOOGLE_CLIENT_ID = ""
REPO = "Unifight-haifa/unifight"
BRANCH = "main"
TG_BOT_USERNAME = ""
GITHUB_APP_ID = ""
GITHUB_INSTALLATION_ID = ""
TRANSLATE_MODEL = ""

[[d1_databases]]
binding = "DB"
database_name = "unifight-panel"
database_id = "TO-BE-FILLED-05-10"

[triggers]
crons = ["*/5 * * * *"]
