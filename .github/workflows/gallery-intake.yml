---
# Bot-submitted photos live in a PRIVATE staging repo; only the cleaned
# copies are committed here. See docs/bot-content-contracts.md
name: Gallery intake

# no push/pull_request trigger: dispatch needs a token with write access
"on":
  repository_dispatch:
    types: [gallery-intake]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-intake
  cancel-in-progress: false

env:
  INBOX_REPO: ${{ vars.MEDIA_INBOX_REPO || 'Unifight-haifa/media-inbox' }}

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN PRs start no workflows, so the build check would never run
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PANEL_APP_ID }}
          private-key: ${{ secrets.PANEL_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: main
          # the App token goes only to the push/PR step below
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.INBOX_REPO }}
          token: ${{ secrets.MEDIA_INBOX_TOKEN }}
          path: .inbox
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pillow==12.3.0 pillow-heif==1.8.1
      - id: run
        run: |
          python scripts/gallery_intake.py .inbox | tee "$RUNNER_TEMP/added.txt"
          echo "added=$(wc -l < "$RUNNER_TEMP/added.txt")" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.added != '0'
        # the same check the site build runs, before anything reaches main
        run: >-
          node --input-type=module -e "
          import { checkGallery } from './src/lib/gallery-check.mjs';
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          checkGallery(JSON.parse(readFileSync('content/gallery.json', 'utf8')),
          pathToFileURL('src/assets/gallery/'));"
      - if: steps.run.outputs.added != '0'
        name: Open a PR with the cleaned photos
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: gallery-${{ github.run_id }}
        run: |
          for r in . .inbox; do
            git -C "$r" config user.name "github-actions[bot]"
            git -C "$r" config user.email \
              "41898283+github-actions[bot]@users.noreply.github.com"
          done
          git add src/assets/gallery content/gallery.json
          { echo "Gallery: add submitted photos"; echo
            cat "$RUNNER_TEMP/added.txt"; } | git commit -s -F -
          origin="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          git push "$origin" "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Gallery: add submitted photos" \
            --body-file "$RUNNER_TEMP/added.txt"
      - if: steps.run.outputs.added != '0'
        # the cleaned copies live on the PR branch even if the PR is closed
        name: Delete the originals from staging
        run: |
          git -C .inbox add -A incoming/gallery
          git -C .inbox commit -s -q -m "Gallery intake: originals removed"
          git -C .inbox push
