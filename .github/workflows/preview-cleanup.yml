---
name: Preview cleanup

"on":
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          api="$api/pages/projects/unifight-preview/deployments"
          auth="Authorization: Bearer $CF_TOKEN"
          for page in 1 2 3 4 5; do
            curl -fsS -H "$auth" "$api?env=preview&per_page=25&page=$page" \
              | jq -r --arg b "$BRANCH" '.result[]
                | select(.deployment_trigger.metadata.branch == $b) | .id'
          done | sort -u | while read -r id; do
            curl -fsS -X DELETE -H "$auth" "$api/$id?force=true" >/dev/null
          done
