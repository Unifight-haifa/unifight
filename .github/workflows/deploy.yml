---
name: Deploy to GitHub Pages

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # daily after midnight in Israel (00:15 IST / 01:15 IDT): dated schedule
  # changes leave the HTML once they end
  schedule:
    - cron: "15 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR runs must not queue behind or cancel a pending Pages deploy
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

env:
  # Custom domain: set repo Variables, see docs/domain-switch.md
  SITE_URL: >-
    ${{ vars.SITE_URL
    || format('https://{0}.github.io', github.repository_owner) }}
  BASE_PATH: >-
    ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
  # unset means off; PR previews never count; docs/google-analytics-setup.ru.md
  PUBLIC_GA_ID: >-
    ${{ github.event_name != 'pull_request' && vars.PUBLIC_GA_ID || '' }}
  PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
  # admin panel; unset shows "not connected", docs/admin-panel-setup.ru.md
  PUBLIC_ADMIN_API: ${{ vars.PUBLIC_ADMIN_API }}
  PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}

jobs:
  build:
    runs-on: ubuntu-24.04  # playwright has no ubuntu-26.04 build yet
    steps:
      - uses: actions/checkout@v7
      # Playwright for the browser tests that npm test runs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('test/requirements.txt') }}
      - run: pip install -r test/requirements.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - uses: withastro/action@v6
        with:
          # panel commits change only content JSON; rebuild the landing
          build-cmd: npm run gen && npm run build && npm test
      - name: Preview
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        # a Cloudflare outage must not block the required check
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=unifight-preview --branch=${{ github.head_ref }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
      - run: npm run build:linkcheck
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --index-files index.html
            --root-dir ${{ github.workspace }}/.linkcheck/project
            .linkcheck/project
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --index-files index.html
            --root-dir ${{ github.workspace }}/.linkcheck/domain
            .linkcheck/domain

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
